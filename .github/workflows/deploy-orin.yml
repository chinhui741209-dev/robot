name: Deploy to Orin

on:
  push:
    branches:
      - main # 當推送至 main 分支時觸發

jobs:
  deploy:
    runs-on: self-hosted # 指定由 Orin 上的 self-hosted runner 執行
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync files to Orin deployment directory
        run: |
          # 使用 rsync 將 runner 下載的程式碼同步到目標資料夾
          # 排除 .git 與 .github 避免覆蓋
          rsync -av --delete ./ /home/nvidia/poc/poc-orin/ \
            --exclude '.git' \
            --exclude '.github'

      - name: Write version file
        run: |
          echo "Build: ${{ github.sha }}" | cut -c 1-14 > /home/nvidia/poc/poc-orin/VERSION.txt


      - name: Trigger GUI Auto-Restart (Watchdog)
        run: |
          echo "Attempting to kill old GUI processes..."
          # 1. 使用 pkill 強制殺掉匹配路徑的行程
          pkill -9 -f "demo_gui_tk.py" || true
          
          # 2. 備援方案：手動搜尋 PID 並砍掉
          GUI_PID=$(ps aux | grep "demo_gui_tk.py" | grep -v grep | awk '{print $2}')
          if [ ! -z "$GUI_PID" ]; then
            echo "Found GUI PID: $GUI_PID, killing..."
            kill -9 $GUI_PID || true
          fi
          echo "Kill command sent. Watchdog should restart it in 3 seconds."

      - name: Restart robot-core service
        run: |
          # 透過 sudo 重啟系統服務
          sudo systemctl restart robot-core.service

      - name: Verify service status
        run: |
          # 檢查服務狀態確保啟動成功
          systemctl is-active robot-core.service || (echo "Service failed to start" && exit 1)
